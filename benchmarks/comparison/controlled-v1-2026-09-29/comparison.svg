<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title description"><title id="title">TestLore controlled routing comparison</title><desc id="description">Full native Node suite: failing-case recall 1, executed-file fraction 1, median end-to-end 135 milliseconds; TestLore routing: failing-case recall 1, executed-file fraction 0.5729166666666666, median end-to-end 564 milliseconds; JS imports only (diagnostic): failing-case recall 0.42857142857142855, executed-file fraction 0.11458333333333333, median end-to-end 2 milliseconds</desc><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#142238}.label{font-size:17px;font-weight:600}.note{font-size:12px;fill:#5c6c80}.value{font-size:21px;font-weight:600}.heading{font-size:15px;font-weight:600}</style><rect width="1100" height="570" fill="#f8fafc"/><text x="36" y="46" font-size="29" font-weight="700">TestLore: correctness and routing cost</text><text x="36" y="75" font-size="14">12 deterministic changes · 4 modular Node fixtures · 3 repetitions · v22.19.0 / darwin arm64</text><text x="36" y="100" class="note">Controlled synthetic dataset, not a leaderboard or proof of universal superiority.</text><text x="322" y="141" class="heading">Observed fault recall ↑</text><text x="590" y="141" class="heading">Test files executed ↓</text><text x="845" y="141" class="heading">Median end-to-end time ↓</text><path d="M36 153H1064" stroke="#d8e0eb"/><text x="36" y="195" class="label">Full native Node suite</text><text x="36" y="216" class="note">0 missed observed failures</text><rect x="322" y="177" width="230" height="14" rx="3" fill="#8492a6"/><text x="322" y="216" class="value">100.0%</text><rect x="590" y="177" width="210" height="14" rx="3" fill="#8492a6"/><text x="590" y="216" class="value">100.0%</text><rect x="845" y="177" width="47.87234042553192" height="14" rx="3" fill="#8492a6"/><text x="845" y="216" class="value">135 ms</text>
