<text x="36" y="379" class="label">JS imports only (diagnostic)</text><text x="36" y="400" class="note">36 missed observed failures</text><rect x="322" y="361" width="98.57142857142857" height="14" rx="3" fill="#c4842a"/><text x="322" y="400" class="value">42.9%</text><rect x="590" y="361" width="24.0625" height="14" rx="3" fill="#c4842a"/><text x="590" y="400" class="value">11.5%</text><rect x="845" y="361" width="0.7092198581560284" height="14" rx="3" fill="#c4842a"/><text x="845" y="400" class="value">2 ms</text><path d="M36 449H1064" stroke="#d8e0eb"/><text x="36" y="477" font-size="13">Time includes TestLore discovery, planning, execution and evidence retention; no speedup is assumed.</text><text x="36" y="501" font-size="13">Node has no native dependency selection: its full runtime suite is the native baseline.</text><text x="36" y="525" class="note">JSON asset contracts, explicit route setup and conservative dynamic/configuration fallbacks are part of this dataset.</text><text x="36" y="549" class="note">Tool revision 48ebe5c4b93d · dataset SHA-256 2a2ea05cfda34d4d · raw outcomes and limitations accompany this chart.</text></svg>
