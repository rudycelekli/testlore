<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title description">
<title id="title">TestLore: from one change to an evidence loop</title>
<desc id="description">An open-source quality engineer for developers and coding agents. Observe native tests, sign the evidence, challenge claims, review outcomes and learn advisory lessons. Keep your runners. Know why each test runs. Illustrated flow, not live status.</desc>
<rect width="1200" height="730" rx="22" fill="#0e1c23"/>
<path d="M0 80H1200M48 648H1152" stroke="#2c444d"/>
<g font-family="Helvetica Neue,Arial,sans-serif">
<text x="48" y="50" fill="#eff5f1" font-size="23" font-weight="750" letter-spacing="-1">TestLore<tspan fill="#9de9ca">.</tspan></text>
<text x="188" y="48" fill="#bccacf" font-size="10" letter-spacing="2">QUALITY ENGINEERING / OPEN SOURCE</text>
<text x="1152" y="48" text-anchor="end" fill="#9de9ca" font-size="11" letter-spacing="2">KNOW WHY EACH TEST RUNS</text>
<text x="48" y="136" fill="#9de9ca" font-size="11" letter-spacing="2">01 / A QUALITY ENGINEER FOR YOUR REPOSITORY</text>
<g font-size="64" font-weight="750" letter-spacing="-2" fill="#eff5f1"><text x="48" y="215">From one change</text><text x="48" y="286">to an <tspan fill="#9de9ca">evidence</tspan></text><text x="48" y="357" fill="#9de9ca">loop.</text></g>
<text x="48" y="405" fill="#bccacf" font-size="18">Better tests. Smarter plans.</text><text x="48" y="433" fill="#bccacf" font-size="18">A memory that earns its place.</text>
<text x="669" y="136" fill="#9de9ca" font-size="11" letter-spacing="2">WHAT RUNS, AND WHAT STILL NEEDS PROOF</text>
<g fill="#eff5f1" font-size="38" font-weight="700" letter-spacing="-1"><text x="669" y="200">Observe. Sign. Challenge.</text><text x="669" y="246">Learn from reviewed</text><text x="669" y="292">outcomes.</text></g>
<g fill="#bccacf" font-size="17"><text x="669" y="343">Keep the tools you trust. TestLore connects them</text><text x="669" y="370">with modular dependency reasoning, independent</text><text x="669" y="397">validation and local project memory.</text></g>
<rect x="669" y="438" width="483" height="110" rx="14" fill="#182c35" stroke="#2c444d"/>
<text x="695" y="474" fill="#eff5f1" font-size="19">A passing test and its evidence recorder</text><text x="695" y="504" fill="#9de9ca" font-size="19" font-weight="700">have separate health.</text>
<g fill="#bccacf" font-size="12"><text x="669" y="590">Signed observations authenticate the recorder.</text><text x="669" y="611">Reviewed lessons stay advisory. Improvement needs proof.</text></g>
<text x="48" y="691" fill="#9de9ca" font-size="12" letter-spacing="1.8">YOUR ENGINES. A SHARED QUALITY CONTRACT.</text><text x="1152" y="691" text-anchor="end" fill="#bccacf" font-size="12">MIT / EXPERIMENTAL ALPHA</text>
</g>
<g fill="none" stroke="#2c444d"><circle cx="301" cy="548" r="96"/><circle cx="301" cy="548" r="68"/></g><circle cx="301" cy="452" r="5" fill="#9de9ca"/>
