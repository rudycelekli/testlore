<g font-family="Helvetica Neue,Arial,sans-serif" text-anchor="middle"><g fill="#eff5f1" font-size="12" font-weight="700"><text x="105" y="539">OBSERVE</text><text x="237" y="539">WITNESS</text><text x="369" y="539">CHALLENGE</text><text x="501" y="539">OUTCOME</text></g><g fill="#bccacf" font-size="10"><text x="105" y="563">native shadow run</text><text x="237" y="563">sign evidence</text><text x="369" y="563">check the claim</text><text x="501" y="563">explicit review</text><text x="301" y="638" font-size="9" letter-spacing="1">LEARN ONLY AFTER REVIEW</text></g></g>
