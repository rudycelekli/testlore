<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">TestLore: from one change to an evidence loop</title><desc id="desc">Observe a native shadow run, witness its receipt, challenge the claim, review the outcome. Only reviewed outcomes become advisory lessons. Illustration, not a live dashboard.</desc>
<rect width="1200" height="540" rx="22" fill="#0e1c23"/><g fill="none" stroke="#2c444d"><circle cx="845" cy="268" r="200"/><circle cx="845" cy="268" r="157"/></g>
<g font-family="Helvetica Neue,Arial,sans-serif"><text x="50" y="60" fill="#9de9ca" font-size="12" letter-spacing="2">TESTLORE / THE EVIDENCE LOOP</text><text x="50" y="150" fill="#eff5f1" font-size="54" font-weight="700">From one change</text><text x="50" y="213" fill="#eff5f1" font-size="54" font-weight="700">to an</text><text x="195" y="213" fill="#9de9ca" font-size="54" font-weight="700">evidence</text><text x="50" y="276" fill="#9de9ca" font-size="54" font-weight="700">loop.</text><text x="50" y="333" fill="#bccacf" font-size="19">A test result and its recorder</text><text x="50" y="361" fill="#bccacf" font-size="19">have separate health.</text><text x="50" y="449" fill="#bccacf" font-size="15">Signed observations. Challenged claims.</text><text x="50" y="474" fill="#bccacf" font-size="15">Reviewed outcomes. Advisory learning.</text></g>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#9de9ca"/></marker></defs>
<g stroke="#9de9ca" fill="none" stroke-width="2" marker-end="url(#a)"><path d="M677 265H698"/><path d="M828 265H849"/><path d="M979 265H1000"/><path d="M1071 330C1071 440 588 440 588 330" stroke-dasharray="8 6"/></g>
<g fill="#182c35" stroke="#9de9ca" stroke-width="1.5"><rect x="547" y="215" width="130" height="105" rx="14"/><rect x="698" y="215" width="130" height="105" rx="14"/><rect x="849" y="215" width="130" height="105" rx="14" stroke="#e2c787"/><rect x="1000" y="215" width="151" height="105" rx="14"/></g>
<g font-family="Helvetica Neue,Arial,sans-serif" fill="#eff5f1" font-size="15" font-weight="700" text-anchor="middle"><text x="612" y="254">OBSERVE</text><text x="763" y="254">WITNESS</text><text x="914" y="254">CHALLENGE</text><text x="1075" y="254">OUTCOME</text></g>
<g font-family="Helvetica Neue,Arial,sans-serif" fill="#bccacf" font-size="12" text-anchor="middle"><text x="612" y="287">native shadow run</text><text x="763" y="287">sign receipt</text><text x="914" y="287">check claim</text><text x="1075" y="287">explicit review</text><text x="843" y="422" letter-spacing="1">LEARN ONLY AFTER REVIEW</text></g><circle cx="845" cy="68" r="7" fill="#9de9ca"/><text x="1150" y="500" text-anchor="end" font-family="Menlo,monospace" font-size="10" fill="#bccacf" letter-spacing="1">ILLUSTRATION / NOT LIVE HEALTH</text>
</svg>
