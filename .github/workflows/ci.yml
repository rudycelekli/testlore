name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - name: Qualify the complete source scope with native browser cases
        run: TESTLORE_PLAYWRIGHT_BROWSER=1 node scripts/test-qualification.js --output .tddswarm/ci-full-source.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: .tddswarm/ci-full-source.*
          include-hidden-files: true
          if-no-files-found: error
  packed-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Qualify one exact production archive in a fresh project
        run: |
          node scripts/release-candidate.js --output .tddswarm/ci-packed-install --revision "$(git rev-parse HEAD)"
          node scripts/release-candidate.js --verify .tddswarm/ci-packed-install/release-candidate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packed-install-${{ github.event.pull_request.head.sha || github.sha }}
          path: .tddswarm/ci-packed-install/
          include-hidden-files: true
          if-no-files-found: error
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run demo
      - run: npm run benchmark
      - run: npm pack --dry-run
  measured-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/incremental-quality-proof.js --output .tddswarm/ci-incremental.json
      - run: node scripts/native-selection-proof.js .tddswarm/ci-native-selector.json
      - name: Preserve independent failures across four complete CLI arms
        run: node scripts/unified-native-proof.js --output .tddswarm/ci-unified-cli
      - run: node scripts/quality-proof.js --output .tddswarm/ci-quality.json
      - run: node scripts/generated-defects.js > .tddswarm/ci-defects.json
      - name: Reassess retained negative REA measurements without changing outcomes
        run: |
          node scripts/rea-public-pilot.js --verify-frozen benchmarks/rea-20261008 > .tddswarm/ci-rea-original-replay.json
          node scripts/rea-seeded-replay.js benchmarks/rea-projects-20261008 > .tddswarm/ci-rea-seeded-replay.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measured-quality-proof
          path: .tddswarm/ci-*.json
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-cli-proof
          path: |
            .tddswarm/ci-unified-cli/assessment.json
            .tddswarm/ci-unified-cli/protocol.json
            .tddswarm/ci-unified-cli/attempts.jsonl
            .tddswarm/ci-unified-cli/static/*
            .tddswarm/ci-unified-cli/asset/*
          include-hidden-files: true
          if-no-files-found: error
  browser-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - run: TESTLORE_PLAYWRIGHT_BROWSER=1 node --test --test-concurrency=1 test/playwright-native.test.js test/browser-evidence.test.js test/mapping-qualification.test.js
      - run: node scripts/browser-mapping-proof.js --output .tddswarm/ci-browser-mapping.json
      - run: node scripts/playwright-proof.js --output .tddswarm/ci-playwright.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-quality-proof
          path: |
            .tddswarm/ci-playwright.json
            .tddswarm/ci-browser-mapping.json
          include-hidden-files: true
          if-no-files-found: error
