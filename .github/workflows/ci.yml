name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packed-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Qualify one exact production archive in a fresh project
        run: |
          node scripts/release-candidate.js --output .tddswarm/ci-packed-install --revision "$(git rev-parse HEAD)"
          node scripts/release-candidate.js --verify .tddswarm/ci-packed-install/release-candidate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packed-install-${{ github.sha }}
          path: .tddswarm/ci-packed-install/
          include-hidden-files: true
          if-no-files-found: error
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run demo
      - run: npm run benchmark
      - run: npm pack --dry-run
  measured-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/incremental-quality-proof.js --output .tddswarm/ci-incremental.json
      - run: node scripts/native-selection-proof.js .tddswarm/ci-native-selector.json
      - run: node scripts/quality-proof.js --output .tddswarm/ci-quality.json
      - run: node scripts/generated-defects.js > .tddswarm/ci-defects.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measured-quality-proof
          path: .tddswarm/ci-*.json
          include-hidden-files: true
          if-no-files-found: error
  browser-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - run: TESTLORE_PLAYWRIGHT_BROWSER=1 node --test test/playwright-native.test.js test/browser-evidence.test.js
      - run: node scripts/browser-mapping-proof.js --output .tddswarm/ci-browser-mapping.json
      - run: node scripts/playwright-proof.js --output .tddswarm/ci-playwright.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-quality-proof
          path: |
            .tddswarm/ci-playwright.json
            .tddswarm/ci-browser-mapping.json
          include-hidden-files: true
          if-no-files-found: error
