name: npm registry verification
on:
  pull_request:
    paths:
      - .github/workflows/npm-registry-verification.yml
      - benchmarks/releases/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # This checks the immutable first release, independently of moving main.
      - uses: actions/checkout@v7.0.1
        with:
          ref: 1f12728e325f13527b63f4023376debcb9270f8c
          persist-credentials: false
          path: .tddswarm/released-source
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.19.0'
      - name: Install the verifier dependencies without lifecycle scripts
        working-directory: .tddswarm/released-source
        run: npm ci --ignore-scripts
      - name: Restore permanently retained qualification receipts
        run: |
          mkdir -p .tddswarm/released-source/.tddswarm/registry-qualified
          cp benchmarks/releases/0.1.0/release-candidate.json benchmarks/releases/0.1.0/packed-proof.json .tddswarm/released-source/.tddswarm/registry-qualified/
      - name: Download the registry archive and require qualified bytes
        working-directory: .tddswarm/released-source
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const receipt=JSON.parse(fs.readFileSync('.tddswarm/registry-qualified/release-candidate.json'));
          const url='https://registry.npmjs.org/testlore/-/testlore-0.1.0.tgz';
          const response=await fetch(url,{redirect:'error',signal:AbortSignal.timeout(30000)});
          if(!response.ok)throw new Error('Registry download failed');
          const chunks=[];let size=0;
          for await(const chunk of response.body){size+=chunk.length;if(size>16*1024*1024)throw new Error('Archive size limit');chunks.push(chunk);}
          const bytes=Buffer.concat(chunks),sha=createHash('sha256').update(bytes).digest('hex');
          if(sha!==receipt.archiveSha256)throw new Error('Registry archive drift');
          fs.mkdirSync('.tddswarm/registry-fresh',{recursive:true});
          fs.writeFileSync('.tddswarm/registry-qualified/testlore-0.1.0.tgz',bytes);
          fs.writeFileSync('.tddswarm/registry-fresh/download.json',JSON.stringify({url,archiveSha256:sha,bytes:size}));
          JS
      - name: Compare registry metadata and bytes with the source-qualified release
        working-directory: .tddswarm/released-source
        run: node scripts/registry-proof.js --receipt .tddswarm/registry-qualified/release-candidate.json
      - name: Fresh production installation of the downloaded registry archive
        working-directory: .tddswarm/released-source
        run: node scripts/packed-proof.js --archive .tddswarm/registry-qualified/testlore-0.1.0.tgz --expected-sha256 4fa6b36c17aeae3bf1e56f6100ce1ad73d69d6e498f9deb82f8001c32569806a --expected-source-sha 1f12728e325f13527b63f4023376debcb9270f8c --output .tddswarm/registry-fresh/packed-proof.json
      - name: Exercise the documented one-command setup from npm
        working-directory: .tddswarm/released-source
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import os from 'node:os';import path from 'node:path';
          import assert from 'node:assert/strict';import {spawnSync} from 'node:child_process';
          const root=fs.mkdtempSync(path.join(os.tmpdir(),'testlore-registry-setup-'));
          const invoke=(command,args)=>{const r=spawnSync(command,args,{cwd:root,encoding:'utf8',timeout:120000,maxBuffer:16*1024*1024});assert.equal(r.status,0,r.stderr);return r.stdout;};
          try{
            fs.writeFileSync(path.join(root,'package.json'),JSON.stringify({name:'registry-adoption',version:'1.0.0',private:true,type:'module',scripts:{test:'node --test'}}));
            fs.mkdirSync(path.join(root,'test'));
            fs.writeFileSync(path.join(root,'test/example.test.js'),"import test from 'node:test';import assert from 'node:assert/strict';test('addition',()=>assert.equal(2+3,5));test('empty string',()=>assert.equal(''.length,0));");
            for(const args of [['init','-b','main'],['config','user.name','Registry Proof'],['config','user.email','proof@example.invalid'],['add','.'],['commit','-m','Independent adoption baseline']])invoke('git',args);
            const result=JSON.parse(invoke('npm',['exec','--yes','--package=testlore@0.1.0','--','testlore','setup','--verify','--json']));
            assert.equal(result.executionMode,'shadow');assert.equal(result.verification.complete,true);assert.equal(result.verification.exitCode,0);assert.equal(result.verification.shadow,true);assert.equal(result.verification.tests.length,2);
            const workflow=fs.readFileSync(path.join(root,'.github/workflows/tddswarm.yml'),'utf8');
            assert.ok(workflow.includes('rudycelekli/testlore@1f12728e325f13527b63f4023376debcb9270f8c'));
            fs.writeFileSync('.tddswarm/registry-fresh/one-command-setup.json',JSON.stringify({schemaVersion:1,version:'0.1.0',sourceRevision:'1f12728e325f13527b63f4023376debcb9270f8c',command:'npm exec --yes --package=testlore@0.1.0 -- testlore setup --verify --json',complete:true,shadow:true,passedCases:2,workflowSourcePinned:true,scope:'Controlled Node project; no general application compatibility claim.'},null,2)+'\n');
          }finally{fs.rmSync(root,{recursive:true,force:true});}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-registry-verification-${{ github.run_id }}
          path: |
            .tddswarm/released-source/.tddswarm/registry-qualified/registry-proof.json
            .tddswarm/released-source/.tddswarm/registry-fresh/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
