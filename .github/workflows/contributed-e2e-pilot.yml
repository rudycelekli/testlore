name: Contributed e2e public evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/**
      - scripts/contributed-e2e-pilot.js
      - test/contributed-e2e-pilot.test.js
      - .github/workflows/contributed-e2e-pilot.yml
permissions:
  contents: read
concurrency:
  group: contributed-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-unit-project:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
      - name: Seal and install a source candidate, then preserve the upstream environment
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          import {spawnSync} from 'node:child_process';
          import {sealSourceArchive} from './scripts/archive-source.js';
          const output='.tddswarm/contributed-e2e';
          const revision=spawnSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).stdout.trim();
          const archiveDirectory=path.join(process.env.RUNNER_TEMP,'contributed-archive');fs.mkdirSync(archiveDirectory);
          const pack=sealSourceArchive(process.cwd(),revision,archiveDirectory),archive=path.join(archiveDirectory,pack.filename);
          const tools=path.join(process.env.RUNNER_TEMP,'contributed-candidate'),home=path.join(process.env.RUNNER_TEMP,'contributed-install-home');fs.mkdirSync(home);
          const npmrc=path.join(home,'npmrc'),global=path.join(home,'global-npmrc');fs.writeFileSync(npmrc,'registry=https://registry.npmjs.org/\n');fs.writeFileSync(global,'');
          const env={PATH:process.env.PATH,HOME:home,NPM_CONFIG_USERCONFIG:npmrc,NPM_CONFIG_GLOBALCONFIG:global,NPM_CONFIG_CACHE:path.join(home,'npm-cache')};
          const installed=spawnSync('npm',['install','--prefix',tools,'--ignore-scripts','--no-audit','--no-fund',archive],{env,stdio:'inherit',timeout:180000,killSignal:'SIGKILL'});
          if(installed.status!==0||installed.error)process.exit(1);
          const metadata=JSON.parse(fs.readFileSync(path.join(tools,'node_modules/testlore/package.json')));if(metadata.gitHead!==revision)throw Error('Installed candidate source binding differs');
          const result=spawnSync(process.execPath,['scripts/contributed-e2e-pilot.js','--directory',path.join(process.env.RUNNER_TEMP,'contributed-upstream'),'--output',output,'--candidate-root',path.join(tools,'node_modules/testlore')],{stdio:'inherit',timeout:26*60*1000,killSignal:'SIGKILL'});
          const binding={kind:'explicit-source-candidate-not-registry-release',revision,sha256:createHash('sha256').update(fs.readFileSync(archive)).digest('hex'),version:'0.1.0',runId:process.env.GITHUB_RUN_ID};
          if(fs.existsSync(output))fs.writeFileSync(path.join(output,'candidate-install-binding.json'),JSON.stringify(binding,null,2)+'\n');
          if(result.error||![0,3].includes(result.status))process.exit(1);
          const assessment=JSON.parse(fs.readFileSync(path.join(output,'assessment.json')));if(!assessment.observationCompleted)process.exit(1);
          if(!assessment.qualified)console.log('::notice::Complete negative contributed-project comparison; no qualification or speed claim.');
          JS
      - name: Preserve original named outcomes, timings and rejected comparisons
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contributed-e2e-${{ github.run_id }}
          path: .tddswarm/contributed-e2e/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
